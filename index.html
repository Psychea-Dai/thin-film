<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Thin Film</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <canvas id="stage"></canvas>

    <!-- 控制面板：按 H 显示/隐藏，按 T 点按测速 -->
    <aside id="panel" class="panel">
      <header>
        <span class="title">Thin Film</span>
        <button id="hide" class="ghost" title="Hide (H)">×</button>
      </header>

      <div class="row">
        <button id="mic">Microphone</button>
        <button id="test">Test signal</button>
      </div>

      <div class="meters">
        <div class="meter"><span>L</span><i id="mLow"></i></div>
        <div class="meter"><span>M</span><i id="mMid"></i></div>
        <div class="meter"><span>H</span><i id="mHigh"></i></div>
        <b id="pulse" class="pulse"></b>
      </div>

      <div class="row">
        <select id="tempoSource" title="BPM source">
          <option value="off">Grid: off</option>
          <option value="auto">Auto (experimental)</option>
          <option value="tap">Tap</option>
          <option value="manual">Manual</option>
        </select>
        <button id="tap" title="Tap along to the music (T)">Tap</button>
        <input id="bpm" type="number" min="40" max="240" step="0.5" value="120" title="Manual BPM" />
      </div>
      <div id="tempoReadout" class="readout">—</div>

      <div class="row">
        <label>Quality
          <select id="quality">
            <option value="1">High</option>
            <option value="0.75">Medium</option>
            <option value="0.5">Low</option>
          </select>
        </label>
        <span id="fps" class="readout"></span>
      </div>

      <p id="status" class="status"></p>
    </aside>
    <button id="show" class="show" title="Show panel (H)">·</button>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
